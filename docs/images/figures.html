    type: 'bar',
    data: {
        labels: ['准确率 (%)', '平均IoU (%)', 'F1分数', '精确率', '召回率'],
        datasets: [
            {
                label: '改进U-Net',
                data: [89.5, 82.3, 0.878, 0.912, 0.847],
                backgroundColor: 'rgba(54, 138, 221, 0.8)',
                borderColor: 'rgba(54, 138, 221, 1)',
                borderWidth: 1
            },
            {
