version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: pine-nematode-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pine_nematode_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pine-nematode-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pine_nematode_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  # Vue 前端 (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pine-nematode-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # PyTorch 模型服务 (可选)
  model-service:
    build:
      context: ./models
      dockerfile: Dockerfile
    container_name: pine-nematode-model
    restart: always
    environment:
      MODEL_TYPE: UNET
      DEVICE: cpu
    ports:
      - "5000:5000"
    volumes:
      - model_data:/app/models/checkpoints

volumes:
  mysql_data:
  model_data:
